# NFRGuide.com — Render Blueprint (Batch 23, Phase 3C staging).
#
# STAGING ONLY on Render's FREE Web Service; production is a separately-selected paid VPS.
# This file contains NO secret values — every secret uses `sync: false` and is set in the
# Render dashboard. Migrations are NOT run in the build (approval-gated; see
# docs/batches/batch-23/07_STAGING_DATABASE_ISOLATION.md). Do not deploy without owner
# approval (docs/batches/batch-23/09_DEPLOYMENT_APPROVAL_CHECKLIST.md).
#
# Free-tier notes (verified 2026-11, render.com/docs/free):
#   - Service spins down after 15 min idle; ~1 min cold start on next request.
#   - Ephemeral filesystem → local media is lost on redeploy/restart; MEDIA_STORAGE_PROVIDER
#     MUST be `r2` (never `local`) so uploads persist in Cloudflare R2.
#   - 750 free instance-hours / month / workspace.
#   - Render's free PostgreSQL EXPIRES 30 days after creation and has no backups — prefer a
#     dedicated Aiven STAGING database/role instead (see report 07).

services:
  - type: web
    name: nfrguide-staging
    runtime: node
    plan: free
    rootDir: apps/web
    branch: main
    autoDeploy: false            # owner triggers deploys explicitly (approval gate)
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start  # `next start`; Node runtime (sharp needs it — not edge)
    healthCheckPath: /api/health/
    envVars:
      # --- runtime (non-secret) ---
      - key: NODE_VERSION
        value: "22.23.4"         # matches .nvmrc
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production        # staging runs the production build + prod env guards
      - key: MEDIA_STORAGE_PROVIDER
        value: r2                # ephemeral FS → must use R2, never local
      - key: LOG_LEVEL
        value: info
      # --- secrets / per-environment (set in the Render dashboard; never committed) ---
      # The ONE origin this deployment claims as its own. It is INLINED INTO THE
      # BUILD (every NEXT_PUBLIC_* value is), so it is baked into prerendered
      # canonicals, Open Graph URLs, robots.txt and every sitemap <loc>. Changing
      # it in the dashboard therefore requires a REBUILD — a restart alone leaves
      # the old origin in the already-generated HTML. See IDX-02 release prep.
      # Now that the official domain and the Render hostname share this service,
      # it must be https://nfrguide.com, not the onrender.com hostname.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL              # dedicated Aiven STAGING DB via a least-privilege role (NOT prod, NOT localhost)
        sync: false
      - key: MEDIA_S3_ENDPOINT         # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_REGION           # "auto" for R2
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID    # rotated, bucket-scoped R2 token
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      # --- scheduled publishing (Stage 01 / Stage 08) ---
      # Required by app/api/internal/revalidate/route.ts and the in-process
      # scheduler (lib/cms/scheduledPublishRunner.ts). The endpoint fails CLOSED:
      # without this value the scheduler still publishes to the database but the
      # public pages are never revalidated, so a scheduled publish silently does
      # not appear on the site. Set any long random value in the dashboard; it is
      # only ever used for localhost-to-localhost calls inside the instance.
      # NOTE: free-tier instances spin down after 15 min idle, so a schedule only
      # fires while the instance is awake (owner decision D-12 — scheduler host).
      - key: INTERNAL_REVALIDATE_SECRET
        sync: false
      # --- site-wide SEO kill switch (Batch 29; made safe in IDX-02) ---
      #
      # MUST NOT be "true" on this service. nfrguide.com and the Render hostname
      # resolve to the SAME service, so this variable no longer means "noindex the
      # staging site" — it means "noindex EVERY hostname, production included".
      # Setting it true here would remove nfrguide.com from search results.
      #
      # Staging protection no longer depends on it. middleware.ts decides per
      # request from the Host header (lib/seo/productionHosts.ts): the Render
      # hostname and any unknown host get X-Robots-Tag: noindex, nofollow, while
      # the official domain does not — with no configuration at all.
      #
      # Declared explicitly as "false" rather than deleted, so that a Blueprint
      # sync actively asserts the safe value instead of leaving behind whatever a
      # dashboard edit set. tests/deploy-config.test.ts pins this, and pins it
      # against the middleware's own rule rather than against a copy of it.
      #
      # EMERGENCY USE ONLY: to noindex the whole site deliberately, change it both
      # here and in the dashboard in the same change — otherwise the next
      # Blueprint sync resets it to "false".
      - key: STAGING_NOINDEX
        value: "false"
      # --- optional ---
      - key: APP_VERSION
        sync: false
      - key: APP_COMMIT
        sync: false
      # SENTRY_DSN — add only when an owner-approved monitoring integration lands.
