# NFRGuide.com — Render Blueprint (Batch 23, Phase 3C staging).
#
# ───────────────────────────────────────────────────────────────────────────────
# STALE HEADING, CORRECTED IN STAGE 04-R (INF-02). Read this before the next line.
#
# The "STAGING ONLY / production is a separately-selected paid VPS" sentence below
# no longer describes reality, and the STAGING_NOINDEX note further down already
# contradicts it ("the official domain and the Render hostname share this
# service"). Verified read-only over public HTTP on 2026-11-28:
#
#   https://nfr-qadd.onrender.com/        -> 200, serves this application
#                                            (X-Robots-Tag: noindex, nofollow)
#   https://nfrguide.com/                 -> 200, serves this application,
#                                            canonical origin, indexable
#   https://nfrguide-staging.onrender.com -> 404, x-render-routing: no-server
#   https://nfr-gadd.onrender.com         -> 404, x-render-routing: no-server
#
# So ONE service currently answers for both the official domain and the Render
# hostname, and no service is bound to `nfrguide-staging.onrender.com`.
#
# `*.onrender.com` is wildcard-resolved by Render (all three hostnames above
# resolve to the same edge IPs) and routing is decided from the Host header, so a
# 404 proves only that no service claims that hostname — never a service's
# identity. The identity below came from the dashboard instead.
#
# OWNER-CONFIRMED DASHBOARD EVIDENCE (2026-11-28, Stage 05). The live service is:
#
#   name            nfr                  <- this file still declares nfrguide-staging
#   branch          main                 <- matches
#   rootDir         apps/web             <- matches
#   autoDeploy      On Commit            <- this file still declares false
#   runtime Node    22.23.4              <- matches NODE_VERSION below
#   deployed commit 70da23b              <- Stage 03 reserved-route fix IS live
#
# So two keys below do NOT describe the running service: `name` and `autoDeploy`.
# They are left exactly as they are, deliberately:
#   - `name`: Render keys services by name during a sync, so renaming can create
#     a SECOND service instead of adopting the running one.
#   - `autoDeploy`: the live service deploys on commit, which means A GIT PUSH TO
#     `main` DEPLOYS TO PRODUCTION. Changing this value here would not alter that
#     until a sync, and a sync is out of scope. Treat every push as a release.
#
# Still unverified, and therefore still not asserted: whether this Blueprint was
# ever synced, and how the live service was originally created.
#
# Also reported missing from the dashboard: `APP_ENV` (tracked as INF-05). It is
# declared below as `production`. Nothing in the request path depends on it —
# lib/env.ts falls back to NODE_ENV — but lib/cms/scheduledPublishRunner.ts reads
# APP_ENV *directly* and so keeps the scheduled-publishing writer disabled while
# it is unset. Adding it is safe only while SCHEDULED_PUBLISHING stays "off".
#
# DO NOT change `name:` below to match the live hostname. In a Blueprint sync,
# Render keys services by name: renaming can create a SECOND service rather than
# adopt the running one. Any rename is an owner decision made in the dashboard.
# ───────────────────────────────────────────────────────────────────────────────
#
# STAGING ONLY on Render's FREE Web Service; production is a separately-selected paid VPS.
# This file contains NO secret values — every secret uses `sync: false` and is set in the
# Render dashboard. Migrations are NOT run in the build (approval-gated; see
# docs/batches/batch-23/07_STAGING_DATABASE_ISOLATION.md). Do not deploy without owner
# approval (docs/batches/batch-23/09_DEPLOYMENT_APPROVAL_CHECKLIST.md).
#
# Free-tier notes (verified 2026-11, render.com/docs/free):
#   - Service spins down after 15 min idle; ~1 min cold start on next request.
#   - Ephemeral filesystem → local media is lost on redeploy/restart; MEDIA_STORAGE_PROVIDER
#     MUST be `r2` (never `local`) so uploads persist in Cloudflare R2.
#   - 750 free instance-hours / month / workspace.
#   - Render's free PostgreSQL EXPIRES 30 days after creation and has no backups — prefer a
#     dedicated Aiven STAGING database/role instead (see report 07).

services:
  - type: web
    name: nfrguide-staging
    runtime: node
    plan: free
    rootDir: apps/web
    branch: main
    autoDeploy: false            # owner triggers deploys explicitly (approval gate)
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start  # `next start`; Node runtime (sharp needs it — not edge)
    healthCheckPath: /api/health/
    envVars:
      # --- runtime (non-secret) ---
      - key: NODE_VERSION
        value: "22.23.4"         # matches .nvmrc
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production        # staging runs the production build + prod env guards
      - key: MEDIA_STORAGE_PROVIDER
        value: r2                # ephemeral FS → must use R2, never local
      - key: LOG_LEVEL
        value: info
      # --- secrets / per-environment (set in the Render dashboard; never committed) ---
      # The ONE origin this deployment claims as its own. It is INLINED INTO THE
      # BUILD (every NEXT_PUBLIC_* value is), so it is baked into prerendered
      # canonicals, Open Graph URLs, robots.txt and every sitemap <loc>. Changing
      # it in the dashboard therefore requires a REBUILD — a restart alone leaves
      # the old origin in the already-generated HTML. See IDX-02 release prep.
      # Now that the official domain and the Render hostname share this service,
      # it must be https://nfrguide.com, not the onrender.com hostname.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL              # dedicated Aiven STAGING DB via a least-privilege role (NOT prod, NOT localhost)
        sync: false
      - key: MEDIA_S3_ENDPOINT         # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_REGION           # "auto" for R2
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID    # rotated, bucket-scoped R2 token
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      # --- scheduled publishing (Stage 01 / Stage 08) ---
      # Required by app/api/internal/revalidate/route.ts and the in-process
      # scheduler (lib/cms/scheduledPublishRunner.ts). The endpoint fails CLOSED:
      # without this value the scheduler still publishes to the database but the
      # public pages are never revalidated, so a scheduled publish silently does
      # not appear on the site. Set any long random value in the dashboard; it is
      # only ever used for localhost-to-localhost calls inside the instance.
      # NOTE: free-tier instances spin down after 15 min idle, so a schedule only
      # fires while the instance is awake (owner decision D-12 — scheduler host).
      - key: INTERNAL_REVALIDATE_SECRET
        sync: false
      # Batch 02 Task A — explicit authorization for the in-process publishing
      # WRITER (lib/cms/scheduledPublishRunner.ts). The scheduler now starts only
      # when APP_ENV=production AND this value is exactly "on"; anything else,
      # including an unlabelled process and a production build verified on a
      # laptop, leaves it disabled. That is what stops a cloud-connected local
      # server from publishing to the managed database.
      #
      # Declared as "off" here, and asserted rather than omitted, for the same
      # reason as STAGING_NOINDEX below: a Blueprint sync must restore the safe
      # value instead of inheriting whatever a dashboard edit left behind. This
      # service is STAGING, so it must not own the writer.
      #
      # Exactly ONE deployment may set "on". Until an owner sets it on the
      # production service, scheduled page-layout publishing does not run there.
      - key: SCHEDULED_PUBLISHING
        value: "off"
      # --- site-wide SEO kill switch (Batch 29; made safe in IDX-02) ---
      #
      # MUST NOT be "true" on this service. nfrguide.com and the Render hostname
      # resolve to the SAME service, so this variable no longer means "noindex the
      # staging site" — it means "noindex EVERY hostname, production included".
      # Setting it true here would remove nfrguide.com from search results.
      #
      # Staging protection no longer depends on it. proxy.ts (renamed from
      # middleware.ts in Batch 02's predecessor, when Next 16 deprecated the
      # `middleware` convention) decides per request from the Host header
      # (lib/seo/productionHosts.ts): the Render
      # hostname and any unknown host get X-Robots-Tag: noindex, nofollow, while
      # the official domain does not — with no configuration at all.
      #
      # Declared explicitly as "false" rather than deleted, so that a Blueprint
      # sync actively asserts the safe value instead of leaving behind whatever a
      # dashboard edit set. tests/deploy-config.test.ts pins this, and pins it
      # against the middleware's own rule rather than against a copy of it.
      #
      # EMERGENCY USE ONLY: to noindex the whole site deliberately, change it both
      # here and in the dashboard in the same change — otherwise the next
      # Blueprint sync resets it to "false".
      - key: STAGING_NOINDEX
        value: "false"
      # --- optional ---
      - key: APP_VERSION
        sync: false
      - key: APP_COMMIT
        sync: false
      # SENTRY_DSN — add only when an owner-approved monitoring integration lands.
