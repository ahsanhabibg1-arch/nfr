name: CI

# Hosting-independent CI (Batch 13 §9, Batch A §A6). Runs schema validation, migrations +
# neutral test fixtures on a DISPOSABLE Postgres service, typecheck, the full Vitest suite
# (failing on any unexpected skip), a production build, an HTTP route smoke and Playwright
# browser/accessibility smoke tests.
# It NEVER connects to Aiven production, uses production R2 credentials, or deploys.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        # Matches the production major version (Aiven PostgreSQL 18.6 —
        # AIVEN_CLOUD_DATABASE_VERIFICATION.md §3).
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nfrguide_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Isolated, ephemeral, non-secret CI configuration. No production services, no real secrets.
      APP_ENV: test
      NODE_ENV: test
      MEDIA_STORAGE_PROVIDER: local
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nfrguide_ci?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/nfrguide_ci?schema=public
      # A missing/unreachable test database must fail the run, never skip silently.
      REQUIRE_DB_TESTS: '1'
      # CI Postgres superuser can create databases, so the from-zero migration replay runs here.
      MIGRATION_REPLAY_ADMIN_URL: postgresql://ci:ci@localhost:5432/postgres
      E2E_BASE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Assert the database target is the disposable CI service
        run: |
          node -e "
            const u = new URL(process.env.DATABASE_URL);
            const t = new URL(process.env.TEST_DATABASE_URL);
            const ok = (x) => x.hostname === 'localhost' && /_ci$/.test(x.pathname.slice(1));
            if (!ok(u) || !ok(t)) { console.error('Refusing: CI must target the local *_ci service database.'); process.exit(1); }
            console.log('DB target OK:', u.hostname + u.pathname);
          "

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Apply migrations to the disposable CI database
        run: npx prisma migrate deploy

      - name: Seed reference data + synthetic test fixtures
        run: npx prisma db seed

      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false

      - name: Unit + integration tests (isolated DB, local storage)
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Fail on unexpectedly skipped tests
        run: node scripts/assert-no-skipped-tests.mjs vitest-results.json tests/allowed-skips.json

      - name: Full-text search / migration replay gate
        run: npm run test:migration

      - name: Production build (isolated config)
        run: npx next build

      - name: Start the built app against the CI database
        run: |
          nohup npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && exit 0; sleep 2; done
          cat next-start.log; exit 1

      - name: HTTP route smoke (read-only)
        run: npm run test:routes
        env:
          SMOKE_BASE_URL: http://localhost:3100

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke + accessibility (Playwright + axe)
        run: npx playwright test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            apps/web/vitest-results.json
            apps/web/playwright-report/
            apps/web/next-start.log
          if-no-files-found: ignore
